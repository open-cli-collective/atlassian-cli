name: Test Chocolatey Packaging

on:
  push:
    branches: [main]
    paths:
      - 'tools/*/packaging/chocolatey/**'

jobs:
  test-cfl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nuspec
        run: |
          cd tools/cfl/packaging/chocolatey
          # Check nuspec is valid XML
          [xml]$nuspec = Get-Content confluence-cli.nuspec
          Write-Host "Package ID: $($nuspec.package.metadata.id)"
          Write-Host "Title: $($nuspec.package.metadata.title)"

      - name: Validate install script syntax
        shell: pwsh
        run: |
          $script = Get-Content tools/cfl/packaging/chocolatey/tools/chocolateyInstall.ps1 -Raw
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found:"
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Install script syntax is valid"

      - name: Test rendered package
        shell: pwsh
        run: |
          $version = '0.0.1-test'
          $packageDir = 'tools/cfl/packaging/chocolatey'
          $nuspecPath = Join-Path $packageDir 'confluence-cli.nuspec'
          $nuspec = (Get-Content $nuspecPath -Raw).Replace('<version>0.0.0</version>', "<version>$version</version>")
          Set-Content $nuspecPath $nuspec

          $scriptPath = Join-Path $packageDir 'tools/chocolateyInstall.ps1'
          $script = Get-Content $scriptPath -Raw
          $script = $script.Replace('URL_AMD64_PLACEHOLDER', "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_amd64.zip")
          $script = $script.Replace('URL_ARM64_PLACEHOLDER', "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_arm64.zip")
          $script = $script.Replace('CHECKSUM_AMD64_PLACEHOLDER', 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
          $script = $script.Replace('CHECKSUM_ARM64_PLACEHOLDER', 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb')
          Set-Content $scriptPath $script

          Push-Location $packageDir
          try {
            choco pack --verbose
          } finally {
            Pop-Location
          }

          $packagePath = Join-Path $packageDir "confluence-cli.$version.nupkg"
          if (-not (Test-Path $packagePath)) { throw "Expected package was not created: $packagePath" }
          $extractDir = Join-Path $env:RUNNER_TEMP "cfl-choco-$([guid]::NewGuid())"
          Expand-Archive -Path $packagePath -DestinationPath $extractDir
          $renderedPath = Join-Path $extractDir 'tools/chocolateyInstall.ps1'
          $rendered = Get-Content $renderedPath -Raw
          if ($rendered -match 'URL_AMD64_PLACEHOLDER|URL_ARM64_PLACEHOLDER|CHECKSUM_AMD64_PLACEHOLDER|CHECKSUM_ARM64_PLACEHOLDER|ChocolateyPackageVersion|\$\{version\}') {
            throw 'Rendered cfl package still contains a URL/checksum placeholder or runtime package-version expression'
          }
          $expectedAmd64 = "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_amd64.zip"
          $expectedArm64 = "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_arm64.zip"
          if (-not $rendered.Contains($expectedAmd64)) { throw "Rendered package is missing $expectedAmd64" }
          if (-not $rendered.Contains($expectedArm64)) { throw "Rendered package is missing $expectedArm64" }

  test-jtk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nuspec
        run: |
          cd tools/jtk/packaging/chocolatey
          # Check nuspec is valid XML
          [xml]$nuspec = Get-Content jira-ticket-cli.nuspec
          Write-Host "Package ID: $($nuspec.package.metadata.id)"
          Write-Host "Title: $($nuspec.package.metadata.title)"

      - name: Validate install script syntax
        shell: pwsh
        run: |
          $script = Get-Content tools/jtk/packaging/chocolatey/tools/chocolateyInstall.ps1 -Raw
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found:"
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Install script syntax is valid"

      - name: Test pack (dry run)
        run: |
          cd tools/jtk/packaging/chocolatey
          # Update version for test
          $nuspec = Get-Content jira-ticket-cli.nuspec
          $nuspec = $nuspec -replace '<version>.*</version>', '<version>0.0.1-test</version>'
          $nuspec | Set-Content jira-ticket-cli.nuspec
          choco pack --verbose
