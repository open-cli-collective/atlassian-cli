name: Chocolatey Publish cfl

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.9.150)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $tag = "cfl-v$version"
          gh release download $tag --pattern "cfl_${version}_windows_*.zip" --pattern "checksums.txt" --dir artifacts

      - name: Extract checksums
        run: |
          $version = "${{ inputs.version }}"
          $checksums = Get-Content artifacts/checksums.txt
          $amd64 = ($checksums | Select-String "cfl_${version}_windows_amd64.zip").ToString().Split(" ")[0]
          $arm64 = ($checksums | Select-String "cfl_${version}_windows_arm64.zip").ToString().Split(" ")[0]
          echo "CHECKSUM_AMD64=$amd64" >> $env:GITHUB_ENV
          echo "CHECKSUM_ARM64=$arm64" >> $env:GITHUB_ENV

      - name: Update nuspec version
        run: |
          $version = "${{ inputs.version }}"
          $nuspec = Get-Content tools/cfl/packaging/chocolatey/confluence-cli.nuspec
          $nuspec = $nuspec -replace '<version>.*</version>', "<version>$version</version>"
          $nuspec | Set-Content tools/cfl/packaging/chocolatey/confluence-cli.nuspec

      - name: Update install script checksums
        run: |
          $script = Get-Content tools/cfl/packaging/chocolatey/tools/chocolateyInstall.ps1
          $script = $script -replace "CHECKSUM_AMD64_PLACEHOLDER", $env:CHECKSUM_AMD64
          $script = $script -replace "CHECKSUM_ARM64_PLACEHOLDER", $env:CHECKSUM_ARM64
          $script | Set-Content tools/cfl/packaging/chocolatey/tools/chocolateyInstall.ps1

      - name: Update install script URLs
        run: |
          $version = "${{ inputs.version }}"
          $scriptPath = 'tools/cfl/packaging/chocolatey/tools/chocolateyInstall.ps1'
          $script = Get-Content $scriptPath -Raw
          $amd64Url = "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_amd64.zip"
          $arm64Url = "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_arm64.zip"
          if (-not $script.Contains('URL_AMD64_PLACEHOLDER')) { throw 'Missing URL_AMD64_PLACEHOLDER' }
          if (-not $script.Contains('URL_ARM64_PLACEHOLDER')) { throw 'Missing URL_ARM64_PLACEHOLDER' }
          $script = $script.Replace('URL_AMD64_PLACEHOLDER', $amd64Url)
          $script = $script.Replace('URL_ARM64_PLACEHOLDER', $arm64Url)
          if ($script -match 'URL_AMD64_PLACEHOLDER|URL_ARM64_PLACEHOLDER|CHECKSUM_AMD64_PLACEHOLDER|CHECKSUM_ARM64_PLACEHOLDER|ChocolateyPackageVersion|\$\{version\}') {
            throw 'Rendered cfl install script still contains a URL/checksum placeholder or runtime package-version expression'
          }
          if (-not $script.Contains($amd64Url)) { throw "Rendered script is missing $amd64Url" }
          if (-not $script.Contains($arm64Url)) { throw "Rendered script is missing $arm64Url" }
          Set-Content $scriptPath $script

      - name: Pack and push
        run: |
          cd tools/cfl/packaging/chocolatey
          choco pack
          choco push confluence-cli.${{ inputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
