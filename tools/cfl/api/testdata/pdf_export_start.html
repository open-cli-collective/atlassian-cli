<script>
    LongRunningTask = {};
    (function (document, $) {
        LongRunningTask.reloadProgressBar = function (nextButton) {
            var taskId = AJS.Meta.get("taskId");
            var isV3 = AJS.Meta.get("isV3");
            var spaceKey = AJS.Meta.get("spaceKey");
            var url = isV3
                ? "/wiki/api/v2/pdfexporttask/progress/" + taskId + (spaceKey ? "?isSpaceExport=true" : "")

        };
    })(document, jQuery);
