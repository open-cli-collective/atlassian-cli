name: Chocolatey Publish jtk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.75)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must be numeric SemVer (major.minor.patch): $env:VERSION"
          }

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:VERSION
          $tag = "jtk-v$version"
          gh release download $tag --pattern "jtk_${version}_windows_*.zip" --pattern "checksums.txt" --dir artifacts

      - name: Extract checksums
        run: |
          $checksumJson = pwsh -NoProfile -File tools/jtk/scripts/extract-chocolatey-checksums.ps1 `
            -Version $env:VERSION `
            -ChecksumsPath artifacts/checksums.txt
          if ($LASTEXITCODE -ne 0) { throw 'Checksum extraction failed' }
          $checksums = $checksumJson | ConvertFrom-Json
          "CHECKSUM_AMD64=$($checksums.amd64)" >> $env:GITHUB_ENV
          "CHECKSUM_ARM64=$($checksums.arm64)" >> $env:GITHUB_ENV

      - name: Update nuspec version
        run: |
          $version = $env:VERSION
          $nuspec = Get-Content tools/jtk/packaging/chocolatey/jira-ticket-cli.nuspec
          $nuspec = $nuspec -replace '<version>.*</version>', "<version>$version</version>"
          $nuspec | Set-Content tools/jtk/packaging/chocolatey/jira-ticket-cli.nuspec

      - name: Render install script
        run: |
          pwsh -File tools/jtk/scripts/render-chocolatey-install.ps1 `
            -Version $env:VERSION `
            -ScriptPath tools/jtk/packaging/chocolatey/tools/chocolateyInstall.ps1 `
            -ChecksumAmd64 $env:CHECKSUM_AMD64 `
            -ChecksumArm64 $env:CHECKSUM_ARM64

      - name: Pack and push
        run: |
          cd tools/jtk/packaging/chocolatey
          choco pack
          $package = "jira-ticket-cli.$($env:VERSION).nupkg"
          choco push $package --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
