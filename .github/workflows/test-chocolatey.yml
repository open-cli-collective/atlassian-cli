name: Test Chocolatey Packaging

on:
  push:
    branches: [main]
    paths:
      - 'tools/*/packaging/chocolatey/**'
      - 'tools/cfl/scripts/**'
      - 'tools/jtk/scripts/**'
      - '.github/workflows/chocolatey-publish-cfl.yml'
      - '.github/workflows/chocolatey-publish-jtk.yml'
      - '.github/workflows/test-chocolatey.yml'
  pull_request:
    paths:
      - 'tools/*/packaging/chocolatey/**'
      - 'tools/cfl/scripts/**'
      - 'tools/jtk/scripts/**'
      - '.github/workflows/chocolatey-publish-cfl.yml'
      - '.github/workflows/chocolatey-publish-jtk.yml'
      - '.github/workflows/test-chocolatey.yml'

jobs:
  test-cfl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nuspec
        run: |
          cd tools/cfl/packaging/chocolatey
          # Check nuspec is valid XML
          [xml]$nuspec = Get-Content confluence-cli.nuspec
          Write-Host "Package ID: $($nuspec.package.metadata.id)"
          Write-Host "Title: $($nuspec.package.metadata.title)"

      - name: Validate install script syntax
        shell: pwsh
        run: |
          $script = Get-Content tools/cfl/packaging/chocolatey/tools/chocolateyInstall.ps1 -Raw
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found:"
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Install script syntax is valid"

      - name: Test rendered package
        shell: pwsh
        run: |
          $version = '0.0.1'
          $packageDir = 'tools/cfl/packaging/chocolatey'
          $nuspecPath = Join-Path $packageDir 'confluence-cli.nuspec'
          $nuspec = (Get-Content $nuspecPath -Raw).Replace('<version>0.0.0</version>', "<version>$version</version>")
          Set-Content $nuspecPath $nuspec

          $scriptPath = Join-Path $packageDir 'tools/chocolateyInstall.ps1'
          $checksumAmd64 = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          $checksumArm64 = 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
          pwsh -File tools/cfl/scripts/render-chocolatey-install.ps1 `
            -Version $version `
            -ScriptPath $scriptPath `
            -ChecksumAmd64 $checksumAmd64 `
            -ChecksumArm64 $checksumArm64

          Push-Location $packageDir
          try {
            choco pack --verbose
          } finally {
            Pop-Location
          }

          $packagePath = Join-Path $packageDir "confluence-cli.$version.nupkg"
          if (-not (Test-Path $packagePath)) { throw "Expected package was not created: $packagePath" }
          $extractDir = Join-Path $env:RUNNER_TEMP "cfl-choco-$([guid]::NewGuid())"
          [IO.Compression.ZipFile]::ExtractToDirectory($packagePath, $extractDir)
          $renderedPath = Join-Path $extractDir 'tools/chocolateyInstall.ps1'
          $rendered = Get-Content $renderedPath -Raw
          if ($rendered -match 'URL_AMD64_PLACEHOLDER|URL_ARM64_PLACEHOLDER|CHECKSUM_AMD64_PLACEHOLDER|CHECKSUM_ARM64_PLACEHOLDER|ChocolateyPackageVersion|\$\{version\}') {
            throw 'Rendered cfl package still contains a URL/checksum placeholder or runtime package-version expression'
          }
          $expectedAmd64 = "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_amd64.zip"
          $expectedArm64 = "https://github.com/open-cli-collective/atlassian-cli/releases/download/cfl-v$version/cfl_${version}_windows_arm64.zip"
          if (-not $rendered.Contains($expectedAmd64)) { throw "Rendered package is missing $expectedAmd64" }
          if (-not $rendered.Contains($expectedArm64)) { throw "Rendered package is missing $expectedArm64" }

          function Install-ChocolateyZipPackage {
            param(
              [string]$PackageName,
              [string]$Url,
              [string]$UnzipLocation,
              [string]$Checksum,
              [string]$ChecksumType
            )
            $global:capturedPackageName = $PackageName
            $global:capturedUrl = $Url
            $global:capturedChecksum = $Checksum
            $global:capturedChecksumType = $ChecksumType
          }

          $env:ChocolateyPackageName = 'confluence-cli'
          $architectures = @(
            @{ Name = 'AMD64'; Environment = 'AMD64'; Url = $expectedAmd64; Checksum = $checksumAmd64 },
            @{ Name = 'ARM64'; Environment = 'ARM64'; Url = $expectedArm64; Checksum = $checksumArm64 }
          )
          foreach ($architecture in $architectures) {
            $previousArchitecture = $env:PROCESSOR_ARCHITECTURE
            try {
              $env:PROCESSOR_ARCHITECTURE = $architecture.Environment
              $global:capturedUrl = $null
              $global:capturedChecksum = $null
              $global:capturedChecksumType = $null
              & $renderedPath
            } finally {
              $env:PROCESSOR_ARCHITECTURE = $previousArchitecture
            }
            if ($global:capturedUrl -ne $architecture.Url) {
              throw "$($architecture.Name) selected URL '$global:capturedUrl', expected '$($architecture.Url)'"
            }
            if ($global:capturedChecksum -ne $architecture.Checksum) {
              throw "$($architecture.Name) selected checksum '$global:capturedChecksum', expected '$($architecture.Checksum)'"
            }
            if ($global:capturedChecksumType -ne 'sha256') {
              throw "$($architecture.Name) selected checksum type '$global:capturedChecksumType', expected 'sha256'"
            }
          }

  test-jtk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nuspec
        run: |
          cd tools/jtk/packaging/chocolatey
          # Check nuspec is valid XML
          [xml]$nuspec = Get-Content jira-ticket-cli.nuspec
          Write-Host "Package ID: $($nuspec.package.metadata.id)"
          Write-Host "Title: $($nuspec.package.metadata.title)"

      - name: Validate install script syntax
        shell: pwsh
        run: |
          $script = Get-Content tools/jtk/packaging/chocolatey/tools/chocolateyInstall.ps1 -Raw
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found:"
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Install script syntax is valid"

      - name: Test rendered package
        shell: pwsh
        run: |
          $version = '0.0.1'
          $packageDir = 'tools/jtk/packaging/chocolatey'
          $nuspecPath = Join-Path $packageDir 'jira-ticket-cli.nuspec'
          $nuspec = (Get-Content $nuspecPath -Raw).Replace('<version>0.0.0</version>', "<version>$version</version>")
          Set-Content $nuspecPath $nuspec

          $scriptPath = Join-Path $packageDir 'tools/chocolateyInstall.ps1'
          $expectedChecksumAmd64 = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          $expectedChecksumArm64 = 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          $checksumsPath = Join-Path $env:RUNNER_TEMP "jtk-checksums-$([guid]::NewGuid()).txt"
          @(
            "$expectedChecksumAmd64  jtk_${version}_windows_amd64.zip"
            "$expectedChecksumArm64  jtk_${version}_windows_arm64.zip"
          ) | Set-Content $checksumsPath
          $checksumJson = pwsh -NoProfile -File tools/jtk/scripts/extract-chocolatey-checksums.ps1 `
            -Version $version `
            -ChecksumsPath $checksumsPath
          if ($LASTEXITCODE -ne 0) { throw 'Checksum extraction failed' }
          $checksums = $checksumJson | ConvertFrom-Json
          $checksumAmd64 = $checksums.amd64
          $checksumArm64 = $checksums.arm64
          if ($checksumAmd64 -ne $expectedChecksumAmd64) { throw "AMD64 checksum was parsed as '$checksumAmd64'" }
          if ($checksumArm64 -ne $expectedChecksumArm64) { throw "ARM64 checksum was parsed as '$checksumArm64'" }
          pwsh -File tools/jtk/scripts/render-chocolatey-install.ps1 `
            -Version $version `
            -ScriptPath $scriptPath `
            -ChecksumAmd64 $checksumAmd64 `
            -ChecksumArm64 $checksumArm64

          Push-Location $packageDir
          try {
            choco pack --verbose
          } finally {
            Pop-Location
          }

          $packagePath = Join-Path $packageDir "jira-ticket-cli.$version.nupkg"
          if (-not (Test-Path $packagePath)) { throw "Expected package was not created: $packagePath" }
          $extractDir = Join-Path $env:RUNNER_TEMP "jtk-choco-$([guid]::NewGuid())"
          [IO.Compression.ZipFile]::ExtractToDirectory($packagePath, $extractDir)
          $renderedPath = Join-Path $extractDir 'tools/chocolateyInstall.ps1'
          $rendered = Get-Content $renderedPath -Raw
          if ($rendered -match 'URL_AMD64_PLACEHOLDER|URL_ARM64_PLACEHOLDER|CHECKSUM_AMD64_PLACEHOLDER|CHECKSUM_ARM64_PLACEHOLDER|ChocolateyPackageVersion|\$\{version\}') {
            throw 'Rendered jtk package still contains a URL/checksum placeholder or runtime package-version expression'
          }
          $expectedAmd64 = "https://github.com/open-cli-collective/atlassian-cli/releases/download/jtk-v$version/jtk_${version}_windows_amd64.zip"
          $expectedArm64 = "https://github.com/open-cli-collective/atlassian-cli/releases/download/jtk-v$version/jtk_${version}_windows_arm64.zip"
          if (-not $rendered.Contains($expectedAmd64)) { throw "Rendered package is missing $expectedAmd64" }
          if (-not $rendered.Contains($expectedArm64)) { throw "Rendered package is missing $expectedArm64" }

          function Install-ChocolateyZipPackage {
            param(
              [string]$PackageName,
              [string]$Url,
              [string]$UnzipLocation,
              [string]$Checksum,
              [string]$ChecksumType
            )
            $global:capturedPackageName = $PackageName
            $global:capturedUrl = $Url
            $global:capturedChecksum = $Checksum
            $global:capturedChecksumType = $ChecksumType
          }

          $env:ChocolateyPackageName = 'jira-ticket-cli'
          $architectures = @(
            @{ Name = 'AMD64'; Environment = 'AMD64'; Url = $expectedAmd64; Checksum = $expectedChecksumAmd64 },
            @{ Name = 'ARM64'; Environment = 'ARM64'; Url = $expectedArm64; Checksum = $expectedChecksumArm64 }
          )
          foreach ($architecture in $architectures) {
            $previousArchitecture = $env:PROCESSOR_ARCHITECTURE
            try {
              $env:PROCESSOR_ARCHITECTURE = $architecture.Environment
              $global:capturedUrl = $null
              $global:capturedChecksum = $null
              $global:capturedChecksumType = $null
              & $renderedPath
            } finally {
              $env:PROCESSOR_ARCHITECTURE = $previousArchitecture
            }
            if ($global:capturedUrl -ne $architecture.Url) {
              throw "$($architecture.Name) selected URL '$global:capturedUrl', expected '$($architecture.Url)'"
            }
            if ($global:capturedChecksum -ne $architecture.Checksum) {
              throw "$($architecture.Name) selected checksum '$global:capturedChecksum', expected '$($architecture.Checksum)'"
            }
            if ($global:capturedChecksumType -ne 'sha256') {
              throw "$($architecture.Name) selected checksum type '$global:capturedChecksumType', expected 'sha256'"
            }
          }
