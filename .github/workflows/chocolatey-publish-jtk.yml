name: Chocolatey Publish jtk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.75)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Version must be numeric SemVer (major.minor.patch): $env:VERSION"
          }

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:VERSION
          $tag = "jtk-v$version"
          gh release download $tag --pattern "jtk_${version}_windows_*.zip" --pattern "checksums.txt" --dir artifacts

      - name: Extract checksums
        run: |
          $version = $env:VERSION
          $checksums = Get-Content artifacts/checksums.txt
          $amd64 = ($checksums | Select-String "jtk_${version}_windows_amd64.zip").ToString().Split(" ")[0]
          $arm64 = ($checksums | Select-String "jtk_${version}_windows_arm64.zip").ToString().Split(" ")[0]
          echo "CHECKSUM_AMD64=$amd64" >> $env:GITHUB_ENV
          echo "CHECKSUM_ARM64=$arm64" >> $env:GITHUB_ENV

      - name: Update nuspec version
        run: |
          $version = $env:VERSION
          $nuspec = Get-Content tools/jtk/packaging/chocolatey/jira-ticket-cli.nuspec
          $nuspec = $nuspec -replace '<version>.*</version>', "<version>$version</version>"
          $nuspec | Set-Content tools/jtk/packaging/chocolatey/jira-ticket-cli.nuspec

      - name: Update install script checksums
        run: |
          $script = Get-Content tools/jtk/packaging/chocolatey/tools/chocolateyInstall.ps1
          $script = $script -replace "CHECKSUM_AMD64_PLACEHOLDER", $env:CHECKSUM_AMD64
          $script = $script -replace "CHECKSUM_ARM64_PLACEHOLDER", $env:CHECKSUM_ARM64
          $script | Set-Content tools/jtk/packaging/chocolatey/tools/chocolateyInstall.ps1

      - name: Update install script URLs
        run: |
          $version = $env:VERSION
          $scriptPath = 'tools/jtk/packaging/chocolatey/tools/chocolateyInstall.ps1'
          $script = Get-Content $scriptPath -Raw
          $amd64Url = "https://github.com/open-cli-collective/atlassian-cli/releases/download/jtk-v$version/jtk_${version}_windows_amd64.zip"
          $arm64Url = "https://github.com/open-cli-collective/atlassian-cli/releases/download/jtk-v$version/jtk_${version}_windows_arm64.zip"
          if (-not $script.Contains('URL_AMD64_PLACEHOLDER')) { throw 'Missing URL_AMD64_PLACEHOLDER' }
          if (-not $script.Contains('URL_ARM64_PLACEHOLDER')) { throw 'Missing URL_ARM64_PLACEHOLDER' }
          $script = $script.Replace('URL_AMD64_PLACEHOLDER', $amd64Url)
          $script = $script.Replace('URL_ARM64_PLACEHOLDER', $arm64Url)
          if ($script -match 'URL_AMD64_PLACEHOLDER|URL_ARM64_PLACEHOLDER|CHECKSUM_AMD64_PLACEHOLDER|CHECKSUM_ARM64_PLACEHOLDER|ChocolateyPackageVersion|\$\{version\}') {
            throw 'Rendered jtk install script still contains a URL/checksum placeholder or runtime package-version expression'
          }
          Set-Content $scriptPath $script

      - name: Pack and push
        run: |
          cd tools/jtk/packaging/chocolatey
          choco pack
          $package = "jira-ticket-cli.$($env:VERSION).nupkg"
          choco push $package --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
