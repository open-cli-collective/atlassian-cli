name: Winget Publish jtk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.75)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit WinGet package
        uses: open-cli-collective/.github/actions/winget-submit@e5d7a9a80785fc39544c3221a2c6654d35b37fcf
        with:
          package-id: OpenCLICollective.jira-ticket-cli
          version: ${{ inputs.version }}
          final-tag: jtk-v${{ inputs.version }}
          repo: ${{ github.repository }}
          working-directory: tools/jtk
          bootstrap: "false"
          github-token: ${{ github.token }}
          winget-token: ${{ secrets.WINGET_GITHUB_TOKEN }}
